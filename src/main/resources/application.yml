spring:
  application:
    name: kurum
  profiles:
    active: local

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    encoding: UTF-8
    mode: HTML
    enabled: true

logging:
  level:
    org.springframework.cache: trace

app:
  oauth2:
    authorizedRedirectUris:
      - http://localhost:5173