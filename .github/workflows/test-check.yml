# 실행할 자동테스트 태스크의 이름 설정
name: PR Test

# 통합브랜치(이 경우에는 develop)에 pr을 할때 아래의 작업 진행
on:
  pull_request:
    branches: [ develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    # 명령어를 실행할 기본 디렉토리 설정
    defaults:
      run:
        working-directory: ./server
    steps:
      # CI 작업을 위해 CI 서버로 코드를 내려받는다
      - uses: actions/checkout@v3
      
      # 자바 버전을 세팅한다 (17로 변경됨)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'

      # Gradle wrapper 파일 실행 권한추가
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Gradle test를 실행한다
      - name: Test with Gradle
        run: ./gradlew test
